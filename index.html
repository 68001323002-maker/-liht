<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home LED Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">
    <header>
      <h1>💡 Smart Home Lighting</h1>
      <div class="connection-badge">
        <span id="statusDot" class="dot offline"></span>
        <span id="mqttConnection">Connecting...</span>
      </div>
    </header>

    <section class="control-card">
      <!-- ภาพจำลองหลอดไฟ -->
      <div class="house-preview">
        <div id="bulbIcon" class="bulb off">💡</div>
        <p id="houseStatus" class="status-text">ไฟปิดอยู่ (OFF)</p>
      </div>

      <!-- ปุ่มควบคุมหลัก -->
      <div class="button-group">
        <button id="onButton" class="btn btn-on">เปิดไฟ (ON)</button>
        <button id="offButton" class="btn btn-off">ปิดไฟ (OFF)</button>
      </div>

      <!-- แถบปรับระดับความสว่าง -->
      <div class="dimmer-control">
        <div class="dimmer-header">
          <label for="brightnessSlider">ระดับความสว่าง (Dimmer)</label>
          <span id="brightnessValue">100%</span>
        </div>
        <input type="range" id="brightnessSlider" min="0" max="100" value="100">
      </div>

      <p id="messageStatus" class="message-status">Waiting for ESP32 connection...</p>
    </section>

    <footer>
      SMART HOME PROJECT | ESP32 (5V 1A LED)
    </footer>
  </main>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
